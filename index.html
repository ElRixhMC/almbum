<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album de Richi y Kari ❤️</title>
  
  <!-- Librería del motor de libro 3D -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #f4eee8; 
      --primary: #8a1c31; 
      --text: #2b2d42;
      --page-bg: #fdf9f1; 
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif; 
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; 
      min-height: 100vh;
    }

    /* --- PANTALLA DE BIENVENIDA --- */
    #pantalla-bienvenida {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 2000;
      transition: opacity 0.8s ease;
      padding: 20px;
    }
    #pantalla-bienvenida h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 10px; text-align: center; }
    .btn-entrar {
      background-color: var(--primary); color: white; padding: 15px 30px;
      border: none; border-radius: 30px; font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(138, 28, 49, 0.4); transition: transform 0.3s, background-color 0.3s;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-entrar:hover { transform: scale(1.05); }

    /* --- ENCABEZADO --- */
    header { text-align: center; margin-top: 20px; font-family: 'Segoe UI', sans-serif; width: 90%; max-width: 800px; }
    h1 { color: var(--primary); margin-bottom: 5px; font-family: 'Georgia', serif; }
    
    .acciones-header {
      display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap;
    }
    .btn-accion {
      background-color: var(--primary); color: white; padding: 10px 20px;
      border: none; border-radius: 25px; font-size: 15px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(138, 28, 49, 0.3); transition: transform 0.2s, opacity 0.2s;
      font-family: 'Segoe UI', sans-serif;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-accion:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-accion:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secundario {
      background-color: #fff; color: var(--primary); border: 2px solid var(--primary);
    }
    #fileInput { display: none; }
    #status { margin-top: 10px; font-size: 14px; color: #666; min-height: 20px; font-weight: bold; }

    /* --- CONTENEDOR DEL LIBRO 3D --- */
    #book-container {
      width: 100%;
      max-width: 800px; 
      height: 500px;    
      margin: 20px auto 40px auto;
      display: block;   
    }

    /* --- PÁGINAS DEL LIBRO --- */
    .page {
      background-color: var(--page-bg);
      color: #333;
      overflow: hidden; 
      box-shadow: inset 0 0 20px rgba(0,0,0,0.03); 
    }
    
    .page-content {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 15px; box-sizing: border-box;
      background-image: radial-gradient(circle, #fff 0%, var(--page-bg) 100%);
    }

    /* ESTILO DE PORTADA Y CONTRAPORTADA */
    .page-cover {
      background-color: var(--primary);
      color: white;
    }
    
    /* Ajuste para mostrar la portada completa sin recortes */
    .cover-content {
      padding: 0 !important;
      background-image: url('portada.png');
      background-position: center;
      background-size: 100% 100%; /* Ajusta la imagen completa a los bordes de la página */
      background-repeat: no-repeat;
      width: 100%;
      height: 100%;
    }

    .back-cover-content {
      background: linear-gradient(135deg, #8a1c31 0%, #5a1220 100%);
      padding: 20px;
    }
    
    .cover-frame {
      border: 2px dashed rgba(255, 255, 255, 0.7);
      padding: 30px 20px;
      border-radius: 8px;
      text-align: center;
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
    }
    .cover-frame h2 { 
      font-size: 2.2rem; 
      margin: 0; 
      color: #fff; 
    }
    .cover-sub { 
      font-size: 1.2rem; 
      margin-top: 15px; 
      font-style: italic; 
      color: #ffd1d9; 
    }
    
    /* Imágenes y videos adaptables con marco Polaroid dinámico */
    .page-content img,
    .page-content video {
      max-width: 85%;
      max-height: 70%;
      width: auto;
      height: auto;
      object-fit: contain;
      background-color: #fff;
      border: 8px solid white; 
      border-bottom: 25px solid white; 
      box-shadow: 2px 4px 15px rgba(0,0,0,0.2);
      border-radius: 2px;
    }

    .btn-ver {
      margin-top: 12px; background-color: transparent; border: 1px solid var(--primary);
      color: var(--primary); padding: 6px 14px; border-radius: 15px;
      cursor: pointer; font-family: 'Segoe UI', sans-serif; font-size: 12px;
      transition: 0.3s;
    }
    .btn-ver:hover { background-color: var(--primary); color: white; }

    /* --- VISTA GALERÍA TRADICIONAL --- */
    #gallery-container {
      display: none;
      width: 90%; max-width: 1000px;
      margin: 30px auto;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
      padding-bottom: 50px;
    }
    .polaroid-card {
      background: white; padding: 15px 15px 25px 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15); border-radius: 4px;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .polaroid-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .polaroid-card img,
    .polaroid-card video {
      width: 100%; height: 260px; object-fit: cover; border-radius: 2px;
      cursor: pointer;
    }
    .polaroid-card span {
      margin-top: 15px; font-family: 'Segoe UI', sans-serif; font-size: 13px; color: #555; word-break: break-word; text-align: center;
    }

    /* --- VISOR (LIGHTBOX) --- */
    #lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9); z-index: 3000;
      flex-direction: column; align-items: center; justify-content: center;
      user-select: none;
    }
    #lightbox-img {
      max-width: 90%; max-height: 80vh; transition: transform 0.2s ease-out;
      border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #lightbox-video {
      max-width: 90%; max-height: 80vh; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: none;
    }
    .cerrar-lightbox {
      position: absolute; top: 20px; right: 30px; font-size: 40px;
      color: white; cursor: pointer; font-weight: bold; z-index: 3010;
      line-height: 1;
    }
    .controles-zoom {
      position: absolute; bottom: 30px; display: flex; gap: 15px; z-index: 3010;
    }
    .btn-zoom {
      background: rgba(255,255,255,0.2); color: white; border: 2px solid white;
      border-radius: 50%; width: 50px; height: 50px; font-size: 24px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-zoom:hover { background: rgba(255,255,255,0.5); }
    
    .loading-spinner { font-family: 'Segoe UI', sans-serif; font-size: 16px; color: var(--primary); margin-top: 20px; font-weight: bold; text-align: center; }

    @media (max-width: 600px) {
      #book-container { height: 420px; }
      .page-content img, .page-content video { max-width: 85%; max-height: 65%; }
    }
  </style>
</head>
<body>

  <audio id="musica-fondo" loop>
    <source src="wonderwall.mp3" type="audio/mpeg">
  </audio>

  <div id="pantalla-bienvenida">
    <h1>Richi y Kari ❤️</h1>
    <p style="margin-bottom: 30px; color: #666; font-size: 1.1rem; text-align: center;">Cada foto, tiene anecdotas que me hacen tener una sonrisa en mi rostro y recordaré hasta que seamos viejitos, juntos</p>
    <button class="btn-entrar" onclick="iniciarExperiencia()">Abrir el Álbum</button>
  </div>

  <header>
    <h1>Nuestro Álbum</h1>
    <div class="acciones-header">
      <button class="btn-accion" id="btnSubirFoto" onclick="document.getElementById('fileInput').click()">+ Añadir foto o video</button>
      <button class="btn-accion btn-secundario" id="btnCambiarVista" onclick="alternarVista()">Ver en Galería</button>
    </div>
    <input type="file" id="fileInput" accept="image/*,video/*" onchange="subirFoto(this)">
    <div id="status"></div>
  </header>

  <div id="loadingText" class="loading-spinner"></div>
  
  <!-- Contenedor del Libro 3D -->
  <div id="book-container">
    <div id="book"></div>
  </div>

  <!-- Contenedor de la Galería Tradicional -->
  <div id="gallery-container"></div>

  <!-- Lightbox de Zoom -->
  <div id="lightbox">
    <span class="cerrar-lightbox" onclick="cerrarLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Vista ampliada">
    <video id="lightbox-video" src="" controls></video>
    <div class="controles-zoom" id="controles-zoom">
      <button class="btn-zoom" onclick="hacerZoom(0.3)">+</button>
      <button class="btn-zoom" onclick="hacerZoom(-0.3)">-</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxK2wLxybyT5mjnMS5R8D9UCD1Axo6j_g0kM7S2_IojyS_2Op7M_R6Mj3DYOsvsraE/exec'; 
    
    let albumFlip = null; 
    let cacheFotos = [];  
    let modoLibroActivo = true;

    function esMediaVideo(item) {
      if (item.mimeType && item.mimeType.startsWith('video/')) return true;
      if (item.isVideo) return true;
      if (item.url && item.url.match(/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i)) return true;
      return false;
    }

    function iniciarExperiencia() {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(e => console.log("Pantalla completa bloqueada por el navegador:", e));
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      } else if (document.documentElement.msRequestFullscreen) {
        document.documentElement.msRequestFullscreen();
      }

      const musica = document.getElementById('musica-fondo');
      const pantalla = document.getElementById('pantalla-bienvenida');
      
      musica.volume = 0.5; 
      musica.play().catch(e => {
        console.log("Audio no auto-reproducido por restricciones del navegador.");
      });
      
      pantalla.style.opacity = '0';
      setTimeout(() => {
        pantalla.style.display = 'none';
        document.getElementById('loadingText').innerText = 'Abriendo album';
        cargarFotos(); 
      }, 800);
    }

    function alternarVista() {
      modoLibroActivo = !modoLibroActivo;
      const bookContainer = document.getElementById('book-container');
      const galleryContainer = document.getElementById('gallery-container');
      const btnVista = document.getElementById('btnCambiarVista');

      if (modoLibroActivo) {
        galleryContainer.style.display = 'none';
        bookContainer.style.display = 'block';
        btnVista.innerHTML = 'Ver en Galería';
        renderizarLibro();
      } else {
        bookContainer.style.display = 'none';
        galleryContainer.style.display = 'grid';
        btnVista.innerHTML = 'Ver como Libro';
        renderizarGaleria();
      }
    }

    let nivelZoom = 1;
    const imgLightbox = document.getElementById('lightbox-img');
    const videoLightbox = document.getElementById('lightbox-video');
    const controlesZoom = document.getElementById('controles-zoom');
    const lightbox = document.getElementById('lightbox');

    function abrirLightbox(url, esVideo = false) {
      if (esVideo) {
        imgLightbox.style.display = 'none';
        controlesZoom.style.display = 'none';
        videoLightbox.style.display = 'block';
        videoLightbox.src = url;
        videoLightbox.play().catch(e => console.log(e));
      } else {
        videoLightbox.style.display = 'none';
        videoLightbox.pause();
        videoLightbox.src = '';
        
        imgLightbox.style.display = 'block';
        controlesZoom.style.display = 'flex';
        imgLightbox.src = url;
        nivelZoom = 1;
        imgLightbox.style.transform = `scale(${nivelZoom})`;
      }
      lightbox.style.display = 'flex';
    }

    function cerrarLightbox() { 
      lightbox.style.display = 'none'; 
      imgLightbox.src = '';
      videoLightbox.pause();
      videoLightbox.src = '';
    }

    function hacerZoom(cambio) {
      if (imgLightbox.style.display === 'none') return;
      nivelZoom += cambio;
      if (nivelZoom < 1) nivelZoom = 1; 
      if (nivelZoom > 4) nivelZoom = 4;
      imgLightbox.style.transform = `scale(${nivelZoom})`;
    }

    imgLightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      hacerZoom(e.deltaY < 0 ? 0.2 : -0.2);
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        cerrarLightbox();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'Escape') cerrarLightbox();
      } else if (modoLibroActivo && albumFlip) {
        if (e.key === 'ArrowRight') albumFlip.flipNext();
        if (e.key === 'ArrowLeft') albumFlip.flipPrev();
      }
    });

    async function cargarFotos() {
      const statusText = document.getElementById('loadingText');

      try {
        const response = await fetch(SCRIPT_URL);
        const textResponse = await response.text();

        let data;
        try {
          data = JSON.parse(textResponse);
        } catch (e) {
          console.error("Respuesta HTML recibida:", textResponse);
          throw new Error("El script devolvió HTML en lugar de JSON. Revisa que tu SCRIPT_URL sea correcta y esté desplegada públicamente.");
        }

        statusText.style.display = 'none';
        cacheFotos = data.photos || [];

        if (modoLibroActivo) {
          renderizarLibro();
        } else {
          renderizarGaleria();
        }

      } catch (err) {
        statusText.innerHTML = `❌ Error al conectar con Google Drive: <br><small>${err.message}</small>`;
        statusText.style.display = 'block';
        console.error(err);
      }
    }

    function renderizarLibro() {
      const bookContainer = document.getElementById('book-container');

      if (albumFlip) {
        try {
          albumFlip.destroy();
        } catch (e) {
          console.log("Limpiando flipbook anterior...");
        }
        albumFlip = null;
      }

      bookContainer.innerHTML = '<div id="book"></div>';
      const bookWrapper = document.getElementById('book');

      let htmlContent = '';

      // PORTADA
      htmlContent += `
        <div class="page page-cover" data-density="hard">
          <div class="page-content cover-content"></div>
        </div>
      `;

      if (cacheFotos.length > 0) {
        [...cacheFotos].reverse().forEach(photo => {
          const esVid = esMediaVideo(photo);
          const mediaTag = esVid 
            ? `<video src="${photo.url}" controls playsinline preload="metadata"></video>`
            : `<img src="${photo.url}" alt="Recuerdo">`;
          const textoBoton = esVid ? 'Ver video en grande' : 'Ver foto en grande';

          htmlContent += `
            <div class="page">
              <div class="page-content">
                ${mediaTag}
                <button class="btn-ver" onclick="abrirLightbox('${photo.url}', ${esVid})">${textoBoton}</button>
              </div>
            </div>
          `;
        });

        if (cacheFotos.length % 2 !== 0) {
          htmlContent += `
            <div class="page">
              <div class="page-content">
                <p style="color:#aaa; font-style:italic; text-align:center;">Esperando nuestro próximo recuerdo...</p>
              </div>
            </div>
          `;
        }
      } else {
        htmlContent += `
          <div class="page"><div class="page-content"><p>Aún no hay elementos.</p></div></div>
          <div class="page"><div class="page-content"><p>¡Sube el primero!</p></div></div>
        `;
      }

      // CONTRAPORTADA
      htmlContent += `
        <div class="page page-cover" data-density="hard">
          <div class="page-content back-cover-content">
            <div class="cover-frame">
              <h2>Fin</h2>
              <div class="cover-sub">Continuará...</div>
            </div>
          </div>
        </div>
      `;

      bookWrapper.innerHTML = htmlContent;

      requestAnimationFrame(() => {
        setTimeout(() => {
          const el = document.getElementById('book');
          if (!el) return;

          albumFlip = new St.PageFlip(el, {
            width: 400,
            height: 500,
            size: "stretch",
            minWidth: 280,
            maxWidth: 400,        
            minHeight: 380,
            maxHeight: 500,
            showCover: true,
            usePortrait: true,
            mobileScrollSupport: false,
            maxShadowOpacity: 0.4
          });

          albumFlip.loadFromHTML(el.querySelectorAll('.page'));
        }, 100);
      });
    }

    function renderizarGaleria() {
      const galleryContainer = document.getElementById('gallery-container');
      let html = '';

      if (cacheFotos.length > 0) {
        [...cacheFotos].reverse().forEach(photo => {
          const esVid = esMediaVideo(photo);
          const mediaTag = esVid
            ? `<video src="${photo.url}" controls playsinline preload="metadata"></video>`
            : `<img src="${photo.url}" alt="Recuerdo" onclick="abrirLightbox('${photo.url}', false)">`;

          html += `
            <div class="polaroid-card">
              ${mediaTag}
              <span>❤️ ${photo.name || 'Recuerdo'}</span>
            </div>
          `;
        });
      } else {
        html = '<p style="text-align:center; grid-column: 1/-1; color: #666;">Aún no hay contenido en el álbum. ¡Sube el primero!</p>';
      }

      galleryContainer.innerHTML = html;
    }

    async function subirFoto(input) {
      if (!input.files || !input.files[0]) return;
      
      const file = input.files[0];
      const status = document.getElementById('status');
      const btnSubir = document.getElementById('btnSubirFoto');

      status.style.color = "#8a1c31";
      status.innerText = '⏳ Subiendo archivo al álbum...';
      if (btnSubir) btnSubir.disabled = true;

      const reader = new FileReader();
      reader.onload = async function() {
        const base64String = reader.result.split(',')[1];
        const payload = { fileName: file.name, mimeType: file.type, base64: base64String };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          
          const textResponse = await response.text();
          let result;
          try {
            result = JSON.parse(textResponse);
          } catch (e) {
            throw new Error("El servidor devolvió HTML al intentar subir el archivo.");
          }

          if (result.success) {
            status.style.color = "green";
            status.innerText = '¡Archivo añadido con éxito! 🎉';
            setTimeout(() => { status.innerText = ''; }, 3000);
            
            document.getElementById('loadingText').innerText = 'Actualizando álbum...';
            document.getElementById('loadingText').style.display = 'block';
            cargarFotos();
          } else {
            status.style.color = "red";
            status.innerText = 'Error al subir el archivo.';
          }
        } catch (error) {
          status.style.color = "red";
          status.innerText = 'Error de conexión.';
          console.error(error);
        } finally {
          if (btnSubir) btnSubir.disabled = false;
          input.value = '';
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
