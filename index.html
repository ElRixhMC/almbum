<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Álbum ❤️</title>
  
  <!-- Librería para el efecto realista del libro -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #f4eee8; 
      --primary: #8a1c31; 
      --text: #2b2d42;
      --page-bg: #fdf9f1; 
    }

    body {
      font-family: 'Georgia', serif; 
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; 
    }

    /* --- PANTALLA DE BIENVENIDA --- */
    #pantalla-bienvenida {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 2000;
      transition: opacity 0.8s ease;
    }
    #pantalla-bienvenida h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 20px; text-align: center; }
    .btn-entrar {
      background-color: var(--primary); color: white; padding: 15px 30px;
      border: none; border-radius: 30px; font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(138, 28, 49, 0.4); transition: transform 0.3s;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-entrar:hover { transform: scale(1.05); }

    /* --- ENCABEZADO --- */
    header { text-align: center; margin-top: 20px; font-family: 'Segoe UI', sans-serif; }
    h1 { color: var(--primary); margin-bottom: 5px; font-family: 'Georgia', serif; }
    .upload-btn {
      background-color: var(--primary); color: white; padding: 10px 20px;
      border: none; border-radius: 25px; font-size: 15px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(138, 28, 49, 0.3); transition: transform 0.2s; margin-top: 10px;
    }
    .upload-btn:hover { transform: translateY(-2px); }
    #fileInput { display: none; }
    #status { margin-top: 10px; font-size: 14px; color: #666; height: 20px; font-weight: bold; }

    /* --- CONTENEDOR DEL LIBRO --- */
    .album-wrapper {
      width: 100%; max-width: 1000px;
      height: 600px; /* ALTURA FIJA PARA EVITAR QUE EL MOTOR FALLE */
      display: flex; justify-content: center; align-items: center;
      margin-top: 20px; margin-bottom: 40px;
    }
    
    .page {
      background-color: var(--page-bg);
      color: #333;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.05); 
      overflow: hidden;
    }
    
    .page-cover {
      background-color: var(--primary);
      color: white;
      border: 2px solid #5a1220;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .page-cover h2 { font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; margin: 0; }
    .page-cover p { font-size: 1.2rem; font-style: italic; opacity: 0.9; margin-top: 10px; }
    
    .photo-container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; box-sizing: border-box;
      background-image: radial-gradient(circle, #fff 0%, var(--page-bg) 100%);
    }
    .photo-container img {
      max-width: 90%; max-height: 80%;
      border: 8px solid white; 
      border-bottom: 25px solid white; 
      box-shadow: 2px 4px 15px rgba(0,0,0,0.2);
      cursor: zoom-in; transition: transform 0.2s;
    }
    .photo-container img:hover { transform: scale(1.02); }

    /* --- VISOR (LIGHTBOX) --- */
    #lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9); z-index: 3000;
      flex-direction: column; align-items: center; justify-content: center;
    }
    #lightbox-img {
      max-width: 90%; max-height: 80vh; transition: transform 0.2s ease-out;
      border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .cerrar-lightbox {
      position: absolute; top: 20px; right: 30px; font-size: 40px;
      color: white; cursor: pointer; font-weight: bold; z-index: 3010;
    }
    .controles-zoom {
      position: absolute; bottom: 30px; display: flex; gap: 15px; z-index: 3010;
    }
    .btn-zoom {
      background: rgba(255,255,255,0.2); color: white; border: 2px solid white;
      border-radius: 50%; width: 50px; height: 50px; font-size: 24px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-zoom:hover { background: rgba(255,255,255,0.5); }
    
    .loading-spinner { font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #d62828; margin-top: 20px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <audio id="musica-fondo" loop>
    <source src="wonderwall.mp3" type="audio/mpeg">
  </audio>

  <div id="pantalla-bienvenida">
    <h1>Para Karissa ❤️</h1>
    <p style="margin-bottom: 30px; color: #666; font-size: 1.1rem; text-align: center;">Nuestro pequeño espacio especial...</p>
    <button class="btn-entrar" onclick="iniciarExperiencia()">Abrir el Álbum ✨</button>
  </div>

  <header>
    <h1>Nuestro Álbum</h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      + Añadir un recuerdo
    </button>
    <input type="file" id="fileInput" accept="image/*" onchange="subirFoto(this)">
    <div id="status"></div>
  </header>

  <div id="loadingText" class="loading-spinner"></div>
  <div class="album-wrapper" id="album-wrapper"></div>

  <div id="lightbox">
    <span class="cerrar-lightbox" onclick="cerrarLightbox()">&times;</span>
    <img id="lightbox-img" src="">
    <div class="controles-zoom">
      <button class="btn-zoom" onclick="hacerZoom(0.3)">+</button>
      <button class="btn-zoom" onclick="hacerZoom(-0.3)">-</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypYjYmus0LmLEJodt1orcd9xgP39C5pQT5ZUHEoGRPUOVmLm2KWoSHl_EzchXeueOc/exec';
    let albumFlip = null; 

    function iniciarExperiencia() {
      const musica = document.getElementById('musica-fondo');
      const pantalla = document.getElementById('pantalla-bienvenida');
      musica.volume = 0.5; 
      musica.play().catch(e => console.log("Bloqueo de audio"));
      
      pantalla.style.opacity = '0';
      setTimeout(() => {
        pantalla.style.display = 'none';
        document.getElementById('loadingText').innerText = '⏳ Desempolvando nuestro álbum...';
        cargarFotos(); 
      }, 800);
    }

    let nivelZoom = 1;
    const imgLightbox = document.getElementById('lightbox-img');
    const lightbox = document.getElementById('lightbox');

    function abrirLightbox(event, url) {
      event.stopPropagation(); 
      imgLightbox.src = url;
      nivelZoom = 1;
      imgLightbox.style.transform = `scale(${nivelZoom})`;
      lightbox.style.display = 'flex';
    }

    function cerrarLightbox() { lightbox.style.display = 'none'; }
    function hacerZoom(cambio) {
      nivelZoom += cambio;
      if (nivelZoom < 1) nivelZoom = 1; 
      if (nivelZoom > 4) nivelZoom = 4;
      imgLightbox.style.transform = `scale(${nivelZoom})`;
    }
    imgLightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      hacerZoom(e.deltaY < 0 ? 0.2 : -0.2);
    });

    async function cargarFotos() {
      const wrapper = document.getElementById('album-wrapper');
      const statusText = document.getElementById('loadingText');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        statusText.style.display = 'none';
        
        if (albumFlip) { albumFlip.destroy(); }
        wrapper.innerHTML = '<div id="book"></div>';
        const bookDiv = document.getElementById('book');

        // 1. Portada delantera
        bookDiv.innerHTML += `
          <div class="page page-cover">
            <h2>Nuestro Álbum</h2>
            <p>Karissa & Yo ❤️</p>
            <span style="font-size: 0.8rem; margin-top: 40px; opacity: 0.6;">(Arrastra la esquina o haz clic)</span>
          </div>
        `;

        // 2. Páginas interiores (Fotos)
        if (data.photos && data.photos.length > 0) {
          data.photos.reverse().forEach(photo => {
            bookDiv.innerHTML += `
              <div class="page">
                <div class="photo-container">
                  <img src="${photo.url}" alt="Recuerdo" onclick="abrirLightbox(event, '${photo.url}')">
                </div>
              </div>
            `;
          });

          // Ajuste de páginas pares
          if (data.photos.length % 2 !== 0) {
            bookDiv.innerHTML += `
              <div class="page">
                <div class="photo-container">
                  <p style="color:#aaa; font-style:italic; text-align:center;">Esperando nuestro próximo recuerdo...</p>
                </div>
              </div>
            `;
          }
        } else {
          bookDiv.innerHTML += `
            <div class="page"><div class="photo-container"><p>Aún no hay fotos.</p></div></div>
            <div class="page"><div class="photo-container"><p>¡Sube la primera arriba!</p></div></div>
          `;
        }

        // 3. Portada trasera
        bookDiv.innerHTML += `
          <div class="page page-cover">
            <h2>Fin</h2>
            <p>Por ahora...</p>
          </div>
        `;

        // Validar que la librería se haya descargado bien
        if (typeof StPageFlip === 'undefined') {
            throw new Error("El motor del libro 3D no pudo cargar. Revisa si hay un bloqueador de anuncios activo.");
        }

        // INICIALIZAR EL LIBRO (Ajustado para no fallar)
        albumFlip = new StPageFlip.PageFlip(document.getElementById('book'), {
          width: 400,          
          height: 500,         
          size: "fixed",       // Cambiado a fixed para estabilidad
          showCover: true,     
          usePortrait: true,   // Clave: en celulares se ve de 1 hoja, en PC de 2 hojas
          maxShadowOpacity: 0.4
        });

        albumFlip.loadFromHTML(document.querySelectorAll('.page'));

      } catch (err) {
        statusText.innerText = '❌ Error al animar el libro: ' + err.message;
        statusText.style.display = 'block';
        console.error(err);
      }
    }

    async function subirFoto(input) {
      if (!input.files || !input.files[0]) return;
      
      const file = input.files[0];
      const status = document.getElementById('status');
      status.style.color = "#8a1c31";
      status.innerText = '⏳ Revelando foto y pegándola en el álbum...';

      const reader = new FileReader();
      reader.onload = async function() {
        const base64String = reader.result.split(',')[1];
        const payload = { fileName: file.name, mimeType: file.type, base64: base64String };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.success) {
            status.style.color = "green";
            status.innerText = '¡Foto añadida al álbum! 🎉';
            setTimeout(() => { status.innerText = ''; }, 3000);
            
            document.getElementById('album-wrapper').innerHTML = '';
            document.getElementById('loadingText').innerText = 'Actualizando el álbum...';
            document.getElementById('loadingText').style.display = 'block';
            cargarFotos();
          } else {
            status.style.color = "red";
            status.innerText = 'Error al subir la foto.';
          }
        } catch (error) {
          status.style.color = "red";
          status.innerText = 'Error de conexión.';
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
