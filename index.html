<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Álbum ❤️</title>
  
  <!-- Librería del motor de libro 3D -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  
  <style>
    :root {
      --bg: #f4eee8; 
      --primary: #8a1c31; 
      --text: #2b2d42;
      --page-bg: #fdf9f1; 
    }

    body {
      font-family: 'Georgia', serif; 
      background-color: var(--bg);
      color: var(--text);
      margin: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; 
    }

    /* --- PANTALLA DE BIENVENIDA --- */
    #pantalla-bienvenida {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 2000;
      transition: opacity 0.8s ease;
    }
    #pantalla-bienvenida h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 20px; text-align: center; }
    .btn-entrar {
      background-color: var(--primary); color: white; padding: 15px 30px;
      border: none; border-radius: 30px; font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(138, 28, 49, 0.4); transition: transform 0.3s;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-entrar:hover { transform: scale(1.05); }

    /* --- ENCABEZADO --- */
    header { text-align: center; margin-top: 20px; font-family: 'Segoe UI', sans-serif; }
    h1 { color: var(--primary); margin-bottom: 5px; font-family: 'Georgia', serif; }
    .upload-btn {
      background-color: var(--primary); color: white; padding: 10px 20px;
      border: none; border-radius: 25px; font-size: 15px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(138, 28, 49, 0.3); transition: transform 0.2s; margin-top: 10px;
    }
    .upload-btn:hover { transform: translateY(-2px); }
    #fileInput { display: none; }
    #status { margin-top: 10px; font-size: 14px; color: #666; height: 20px; font-weight: bold; }

    /* --- CONTENEDOR DEL LIBRO --- */
    #book-container {
      width: 100%;
      max-width: 800px; /* Ancho máximo de 2 páginas abiertas juntas */
      height: 500px;    /* Altura fija para evitar que colapse */
      margin: 20px auto 40px auto;
      display: block;   
    }
    
    /* --- PÁGINAS DEL LIBRO --- */
    .page {
      background-color: var(--page-bg);
      color: #333;
      overflow: hidden; 
      box-shadow: inset 0 0 20px rgba(0,0,0,0.03); 
    }
    
    .page-content {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; box-sizing: border-box;
      background-image: radial-gradient(circle, #fff 0%, var(--page-bg) 100%);
    }

    /* Tapas duras */
    .page-cover {
      background-color: var(--primary);
      color: white;
      border: 2px solid #5a1220;
    }
    .page-cover h2 { font-size: 2.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; margin: 0; }
    .page-cover p { font-size: 1.2rem; font-style: italic; opacity: 0.9; margin-top: 10px; }
    
    /* Imágenes tipo Polaroid */
    .page-content img {
      max-width: 90%; max-height: 70%;
      border: 8px solid white; 
      border-bottom: 25px solid white; 
      box-shadow: 2px 4px 15px rgba(0,0,0,0.2);
    }

    /* Botón Ver foto */
    .btn-ver {
      margin-top: 15px; background-color: transparent; border: 1px solid var(--primary);
      color: var(--primary); padding: 5px 15px; border-radius: 15px;
      cursor: pointer; font-family: 'Segoe UI', sans-serif; font-size: 13px;
      transition: 0.3s;
    }
    .btn-ver:hover { background-color: var(--primary); color: white; }

    /* --- VISOR (LIGHTBOX) --- */
    #lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9); z-index: 3000;
      flex-direction: column; align-items: center; justify-content: center;
    }
    #lightbox-img {
      max-width: 90%; max-height: 80vh; transition: transform 0.2s ease-out;
      border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .cerrar-lightbox {
      position: absolute; top: 20px; right: 30px; font-size: 40px;
      color: white; cursor: pointer; font-weight: bold; z-index: 3010;
    }
    .controles-zoom {
      position: absolute; bottom: 30px; display: flex; gap: 15px; z-index: 3010;
    }
    .btn-zoom {
      background: rgba(255,255,255,0.2); color: white; border: 2px solid white;
      border-radius: 50%; width: 50px; height: 50px; font-size: 24px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-zoom:hover { background: rgba(255,255,255,0.5); }
    
    .loading-spinner { font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #d62828; margin-top: 20px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <audio id="musica-fondo" loop>
    <source src="wonderwall.mp3" type="audio/mpeg">
  </audio>

  <div id="pantalla-bienvenida">
    <h1>Para Karissa ❤️</h1>
    <p style="margin-bottom: 30px; color: #666; font-size: 1.1rem; text-align: center;">Nuestro pequeño espacio especial...</p>
    <button class="btn-entrar" onclick="iniciarExperiencia()">Abrir el Álbum ✨</button>
  </div>

  <header>
    <h1>Nuestro Álbum</h1>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      + Añadir un recuerdo
    </button>
    <input type="file" id="fileInput" accept="image/*" onchange="subirFoto(this)">
    <div id="status"></div>
  </header>

  <div id="loadingText" class="loading-spinner"></div>
  
  <div id="book-container"></div>

  <div id="lightbox">
    <span class="cerrar-lightbox" onclick="cerrarLightbox()">&times;</span>
    <img id="lightbox-img" src="">
    <div class="controles-zoom">
      <button class="btn-zoom" onclick="hacerZoom(0.3)">+</button>
      <button class="btn-zoom" onclick="hacerZoom(-0.3)">-</button>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA ESTO POR TU ENLACE REAL DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynOF8xHfgyOSoMDstSCHAHAFFRHm04zu31YqYrDJrf4_D8VMfMBhFrrd2gYKPb8MiS/exec'; 
    
    let albumFlip = null; 

    function iniciarExperiencia() {
      const musica = document.getElementById('musica-fondo');
      const pantalla = document.getElementById('pantalla-bienvenida');
      musica.volume = 0.5; 
      musica.play().catch(e => console.log("Audio no auto-reproducido."));
      
      pantalla.style.opacity = '0';
      setTimeout(() => {
        pantalla.style.display = 'none';
        document.getElementById('loadingText').innerText = '⏳ Desempolvando nuestro álbum...';
        cargarFotos(); 
      }, 800);
    }

    let nivelZoom = 1;
    const imgLightbox = document.getElementById('lightbox-img');
    const lightbox = document.getElementById('lightbox');

    function abrirLightbox(url) {
      imgLightbox.src = url;
      nivelZoom = 1;
      imgLightbox.style.transform = `scale(${nivelZoom})`;
      lightbox.style.display = 'flex';
    }

    function cerrarLightbox() { lightbox.style.display = 'none'; }
    function hacerZoom(cambio) {
      nivelZoom += cambio;
      if (nivelZoom < 1) nivelZoom = 1; 
      if (nivelZoom > 4) nivelZoom = 4;
      imgLightbox.style.transform = `scale(${nivelZoom})`;
    }
    imgLightbox.addEventListener('wheel', (e) => {
      e.preventDefault();
      hacerZoom(e.deltaY < 0 ? 0.2 : -0.2);
    });

    async function cargarFotos() {
      const bookContainer = document.getElementById('book-container');
      const statusText = document.getElementById('loadingText');

      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        statusText.style.display = 'none';
        
        if (albumFlip) { 
          albumFlip.destroy(); 
          albumFlip = null;
        }
        
        let htmlContent = '';

        htmlContent += `
          <div class="page" data-density="hard">
            <div class="page-content page-cover">
              <h2>Nuestro Álbum</h2>
              <p>Karissa & Yo ❤️</p>
              <span style="font-size: 0.8rem; margin-top: 40px; opacity: 0.6;">(Arrastra la esquina)</span>
            </div>
          </div>
        `;

        if (data.photos && data.photos.length > 0) {
          data.photos.reverse().forEach(photo => {
            htmlContent += `
              <div class="page">
                <div class="page-content">
                  <img src="${photo.url}" alt="Recuerdo">
                  <button class="btn-ver" onclick="abrirLightbox('${photo.url}')">🔍 Ver foto en grande</button>
                </div>
              </div>
            `;
          });

          if (data.photos.length % 2 !== 0) {
            htmlContent += `
              <div class="page">
                <div class="page-content">
                  <p style="color:#aaa; font-style:italic; text-align:center;">Esperando nuestro próximo recuerdo...</p>
                </div>
              </div>
            `;
          }
        } else {
          htmlContent += `
            <div class="page"><div class="page-content"><p>Aún no hay fotos.</p></div></div>
            <div class="page"><div class="page-content"><p>¡Sube la primera!</p></div></div>
          `;
        }

        htmlContent += `
          <div class="page" data-density="hard">
            <div class="page-content page-cover">
              <h2>Fin</h2>
              <p>Por ahora...</p>
            </div>
          </div>
        `;

        bookContainer.innerHTML = htmlContent;

        // INICIALIZACIÓN CORREGIDA AQUÍ
        albumFlip = new St.PageFlip(bookContainer, {
          width: 400,
          height: 500,
          size: "stretch",
          minWidth: 300,
          maxWidth: 400,        
          minHeight: 400,
          maxHeight: 500,
          showCover: true,
          usePortrait: true,
          mobileScrollSupport: false,
          maxShadowOpacity: 0.4
        });

        albumFlip.loadFromHTML(document.querySelectorAll('.page'));

      } catch (err) {
        statusText.innerHTML = `❌ Error al crear el libro 3D: <br><small>${err.message}</small>`;
        statusText.style.display = 'block';
        console.error(err);
      }
    }

    async function subirFoto(input) {
      if (!input.files || !input.files[0]) return;
      
      const file = input.files[0];
      const status = document.getElementById('status');
      status.style.color = "#8a1c31";
      status.innerText = '⏳ Pegando foto en el álbum...';

      const reader = new FileReader();
      reader.onload = async function() {
        const base64String = reader.result.split(',')[1];
        const payload = { fileName: file.name, mimeType: file.type, base64: base64String };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.success) {
            status.style.color = "green";
            status.innerText = '¡Foto añadida al álbum! 🎉';
            setTimeout(() => { status.innerText = ''; }, 3000);
            
            document.getElementById('book-container').innerHTML = '';
            document.getElementById('loadingText').innerText = 'Actualizando las páginas...';
            document.getElementById('loadingText').style.display = 'block';
            cargarFotos();
          } else {
            status.style.color = "red";
            status.innerText = 'Error al subir la foto.';
          }
        } catch (error) {
          status.style.color = "red";
          status.innerText = 'Error de conexión.';
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
